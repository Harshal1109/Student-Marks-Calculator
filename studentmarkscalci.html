<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Marks Calculator</h1>

        <label>Student Name</label>
        <input type="text" id="studentName" placeholder="Enter student name">

        <label>English</label>
        <input type="number" id="english" placeholder="Enter marks">

        <label>Mathematics</label>
        <input type="number" id="maths" placeholder="Enter marks">

        <label>Computer</label>
        <input type="number" id="computer" placeholder="Enter marks">

        <label>Science</label>
        <input type="number" id="science" placeholder="Enter marks">

        <label>Programming</label>
        <input type="number" id="programming" placeholder="Enter marks">

        <button onclick="calculateResult()">Calculate Result</button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
